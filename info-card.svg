<svg xmlns="http://www.w3.org/2000/svg" width="490" height="360" viewBox="0 0 490 360" role="img" aria-label="Developer info card">
  <defs>
    <style>
      .frame { fill: #0d1117; }
      .title { font: 600 18px 'Segoe UI', sans-serif; fill: #c9d1d9; }
      .label { font: 13px 'Segoe UI', sans-serif; fill: #8b949e; }
      .value { font: 13px 'Segoe UI', sans-serif; fill: #d0d7de; }
      .row { opacity: 0; animation: fade 0.45s ease-out forwards; }
      @keyframes fade {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>
  <rect x="14" y="14" width="462" height="332" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="42" class="title">avi@github:~$ whoami</text>

  <g class="row" style="animation-delay:0.1s">
    <text x="30" y="90" class="label">Name</text>
    <text x="160" y="90" class="value">Mohd Zaid</text>
  </g>
  <g class="row" style="animation-delay:0.2s">
    <text x="30" y="122" class="label">Role</text>
    <text x="160" y="122" class="value">Full Stack Web Developer</text>
  </g>
  <g class="row" style="animation-delay:0.3s">
    <text x="30" y="154" class="label">Stack</text>
    <text x="160" y="154" class="value">React • Firebase • Node.js • Tailwind</text>
  </g>
  <g class="row" style="animation-delay:0.4s">
    <text x="30" y="186" class="label">Focus</text>
    <text x="160" y="186" class="value">Security • Product • SaaS • CMS</text>
  </g>
  <g class="row" style="animation-delay:0.5s">
    <text x="30" y="218" class="label">Status</text>
    <text x="160" y="218" class="value">Building OzenX & shipping ideas</text>
  </g>
  <g class="row" style="animation-delay:0.6s">
    <text x="30" y="250" class="label">Reach</text>
    <text x="160" y="250" class="value">admin@ozenx.in</text>
  </g>
  <g class="row" style="animation-delay:0.7s">
    <text x="30" y="282" class="label">Location</text>
    <text x="160" y="282" class="value">Meerut, India</text>
  </g>
  <g class="row" style="animation-delay:0.8s">
    <text x="30" y="314" class="label">Planet</text>
    <text x="160" y="314" class="value">Learning • Building • Sharing</text>
  </g>
</svg>
